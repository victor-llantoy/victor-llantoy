name: Actualizar lenguajes
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calcular estadísticas
        env:
          LANGUAGES_TOKEN: ${{ secrets.LANGUAGES_TOKEN }}
        run: python3 scripts/language_stats.py
      - name: Guardar cambios
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Actualizar estadísticas de lenguajes"
          git push
